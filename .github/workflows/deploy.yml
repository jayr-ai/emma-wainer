name: Sync and deploy

on:
  push:
    branches: [main]
  # Minimum cron interval GitHub allows is 5 minutes; scheduled runs can also
  # be delayed by several minutes at busy times. Change the schedule below
  # to adjust the sync frequency (see README for the one-time Google setup).
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sync dependencies
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pip install -r scripts/requirements-sync.txt

      - name: Sync from Google Sheet
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python scripts/sync_sheet.py
        # A non-zero exit here fails the job immediately: no commit, no
        # Pages deploy, and the previously deployed site keeps serving the
        # last good data. GitHub emails the repo owner on the failed run.

      - name: Commit updated data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            POSTS=$(python3 -c "import json; print(json.load(open('data/meta.json'))['ownRows'])")
            THROUGH=$(python3 -c "import json; print(json.load(open('data/meta.json'))['lastDate'])")
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "data: sync from Google Sheet (${POSTS} posts, through ${THROUGH})"
            git push
          else
            echo "No data changes to commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
